<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <!-- Warm feminine gradient - coral to rose -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7EB3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF6B9D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E84A7F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Full background with rounded corners for iOS -->
  <rect x="0" y="0" width="180" height="180" rx="36" ry="36" fill="url(#bgGradient)" />
  
  <!-- Subtle glow ring for warmth -->
  <rect x="14" y="14" width="152" height="152" rx="26" ry="26" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />
  
  <!-- Downward trending line - represents achieving weight goals -->
  <polyline 
    points="32,58 52,72 78,88 108,102 140,115" 
    fill="none" 
    stroke="rgba(255,255,255,0.9)" 
    stroke-width="10" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
  
  <!-- Data point markers - each one is a brave daily weigh-in -->
  <circle cx="32" cy="58" r="8" fill="#FFFFFF" />
  <circle cx="78" cy="88" r="7" fill="#FFFFFF" />
  
  <!-- Heart at the final data point - self-love, celebrating the journey -->
  <path 
    d="M140,115 
       C140,107 146,100 154,100 
       C162,100 168,107 168,115 
       C168,129 140,145 140,145 
       C140,145 112,129 112,115 
       C112,107 118,100 126,100 
       C134,100 140,107 140,115 Z" 
    fill="#FFFFFF"
  />
</svg>
